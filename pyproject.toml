[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-dn8245v-decrypt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pycryptodome>=3.20",
]

[project.scripts]
huawei-config = "huawei_config:main"

[tool.setuptools]
py-modules = ["huawei_config"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501"]                         # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
